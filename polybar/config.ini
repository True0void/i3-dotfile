[colors]
bg = #1E1E2E
no-bg = #1E1E2E
;bg = #af03121c
;no-bg = #00000000
; pywal generated, manually modified
black		= #03121c
black-alt	= #a19c9f
red		= #386685
green		= #9000ffff
yellow		= #FAE3B0
blue		= #7aa2f7
pink		= #ffffffff
cyan		= #8ee8c4
white		= #D9E0EE
background-alt	= #1E1E2E
foreground-alt	= #D9E0EE
grey-1		= #555555

[constants/background]
override-redirect = false
height = 30
fixed-center = true
padding = 4


font-0 = Jet Brains Mono Nerd Font:style=Bold:pixelsize=12;1
font-1 = Iosevka Custom:fontformat=truetype:size=9
font-2 = siji:pixelsize=10;1
font-3 = unifont:fontformat=truetype:size=8:antialias=false;0
font-4 = "Font Awesome 5 Free:style=Regular:pixelsize=10;1"
font-5 = "Font Awesome 5 Free:style=Solid:pixelsize=10;1"
font-6 = "Font Awesome 5 Free:pixelsize=10;1"
font-7 = "SourceHanSansJP-Normal:pixelsize=10;1"

wm-restack = i3

[bar/top]
locale = sv_SE.UTF-8
inherit = constants/background
width = 100%
module-margin-left    = 1
module-margin-right   = 0
padding-left          = 2
padding-right         = 2
enable-ipc	      = true

;tray-position = right
;tray-maxsize = 15
;tray-scale = 1.0
;tray-transparent = true
;tray-background = #00000000

background = #591E1D2F
foreground = ${colors.white}

modules-left = appsmenu terminal firefox files xwindow 
modules-center = i3
modules-right = cpu memory filesystem pulseaudio separator date  battery powermenu ;brightness ;wlan

[module/xwindow]
format-foreground = ${colors.green}
format-padding = 2
type = internal/xwindow
label = %title:0:30:...%

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = true
reverse-scroll = false
fuzzy-match = true

ws-icon-default = 

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-background = #e85d00

label-focused = 
label-focused-foreground = ${colors.green}
label-focused-background = ${colors.background}
label-focused-padding = 2

label-unfocused = 
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.green}
label-unfocused-background = ${colors.background}

label-visible = %icon%
label-visible-underline = #555555
label-visible-padding = 2

label-urgent = 
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.background}
label-urgent-padding = 2 

[module/date]
date                        = %D

format                      = <label>
interval                    = 1.0
label                       = %{A6:time-admin:}%time% %{A}
format-prefix               = %{T1} %{T-}
format-prefix-foreground    = ${colors.green}
format-background           = ${colors.background}
format-foreground           = ${colors.foreground}
time                        = %H:%M
time-alt                    = %A, %B %e  %H:%M:%S %p

type                        = internal/date

[module/battery]
adapter                                 = ADP1
battery                                 = BAT0

format-charging                         = <label-charging>
format-charging-foreground              = #ffffff

format-discharging                      = <ramp-capacity><label-discharging>
format-discharging-foreground           = #ffffff

format-full-foreground                  = #ffffff



full-at                                 = 99

label-charging                          = 
format-charging-padding                 = ${constants.padding}

label-discharging                       = 
format-discharging-padding              = ${constants.padding}

label-full                              = 
format-full-padding                     = ${constants.padding}

poll-interval                           = 5

type                                    = internal/battery

ramp-capacity-0                         = 
ramp-capacity-1                         = 
ramp-capacity-2                         = 
ramp-capacity-3                         = 
ramp-capacity-4                         = 
ramp-capacity-5                         = 
ramp-capacity-6                         = 
ramp-capacity-7                         = 
ramp-capacity-8                         = 
ramp-capacity-9                         = 

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = 
format-volume-prefix-foreground = ${colors.green}
format-volume-prefix-padding-right = 2  
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground-alt}

format-muted-prefix = ﱝ
format-muted-prefix-foreground = ${colors.green}
format-muted-prefix-padding-right = 1
label-muted = MUTE
label-muted-foreground = ${colors.foreground-alt}

;[module/wlan]

[module/appsmenu]
type = custom/text
content-foreground = ${colors.green}
content = " "
click-left = exec rofi -show drun

[module/powermenu]
type = custom/text
content = ""
content-foreground = ${colors.green}
click-left = exec ~/.config/rofi/power.sh

[module/cpu]
type = internal/cpu

interval = 1

format = <label>
format-prefix = %{T1}CPU%{T-}
format-prefix-foreground = ${colors.green}
format-padding = 1
format-background = ${colors.background-alt}
format-foreground = ${colors.foreground}
format-overline = ${colors.background}
format-underline = ${colors.background}

label = " %percentage%%"
label-foreground = ${colors.foreground}

[module/filesystem]
type = internal/fs

; Mountpoints to display
mount-0 = /

; Seconds to sleep between updates
interval = 30

; Display fixed precision values
fixed-values = true

format-mounted = <label-mounted>
format-mounted-prefix = %{T1}HDD%{T-}
format-mounted-prefix-foreground = ${colors.green}
format-mounted-padding = 1
format-mounted-background = ${colors.background-alt}
format-mounted-foreground = ${colors.foreground}
format-mounted-overline = ${colors.background}
format-mounted-underline = ${colors.background}

format-unmounted = <label-unmounted> 
format-unmounted-padding = 1
format-unmounted-prefix = %{T3}%{T-}
format-unmounted-prefix-foreground = ${colors.grey-1}
format-unmounted-background = ${colors.background-alt}
format-unmounted-foreground = ${colors.foreground}
format-unmounted-overline = ${colors.background}
format-unmounted-underline = ${colors.background}

; %mountpoint%
; %type%
; %fsname%
; %percentage_free%
; %percentage_used%
; %total%
; %free%
; %used%
label-mounted = " %percentage_used%%"
label-unmounted = " %mountpoint%: not mounted"

[module/memory]
type = internal/memory

interval = 1

format = <label>
format-prefix = %{T1}MEM%{T-}
format-prefix-foreground = ${colors.green}
format-background = ${colors.background-alt}
format-foreground = ${colors.foreground}
format-overline = ${colors.background}
format-underline = ${colors.background}

; %percentage_used%
; %percentage_free%
; %gb_used%
; %gb_free%
; %gb_total%
; %mb_used%
; %mb_free%
; %mb_total%
; %percentage_swap_used%
; %percentage_swap_free%
; %mb_swap_total%
; %mb_swap_free%
; %mb_swap_used%
; %gb_swap_total%
; %gb_swap_free%
; %gb_swap_used%
label = " %percentage_used%%"
label-foreground = ${colors.foreground}

[module/firefox]
type = custom/text
content = ""
content-padding = 1
content-foreground = ${colors.pink}
click-left = exec firefox

[module/terminal]
type = custom/text
content = ""
content-padding = 1
content-foreground = ${colors.pink}
click-left = exec kitty

[module/brightness]
type = custom/script
content = "☀ "
exec = ~/.config/polybar/brightness.sh
interval = 2
label = "☀%output%"

[module/files]
type = custom/text
content = ""
content-padding = 1
content-foreground = ${colors.pink}
click-left = exec nemo

[module/separator]
type = custom/text
content = "%{T3} %{T-}"
content-foreground = ${colors.foreground}

[settings]
screenchange-reload = true

[global/wm]
margin-top = 5
margin-bottom = 5

; vim:ft=dosini
